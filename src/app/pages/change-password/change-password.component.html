<div class="content-page" style="margin-top:50px">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="header-title">Change Password</h4>
                            <br>
                            <div class="row">
                                <div class="col-lg-12">
                                    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()">
                                        <div class="mb-3">
                                            <label for="example-oldPassword" class="form-label">Old Password*</label>
                                            <input type="password" id="example-oldPassword" class="form-control" 
                                                formControlName="oldPassword">
                                        </div>
                                        <div class="mb-3">
                                            <label for="example-newPassword" class="form-label">New Password*</label>
                                            <input type="password" id="example-newPassword" class="form-control"
                                                formControlName="newPassword">
                                        </div>

                                        <div class="mb-3">
                                            <label for="example-confirmPassword" class="form-label">Confirm Password*</label>
                                            <input type="password" id="example-confirmPassword" name="example-confirmPassword"
                                                class="form-control" formControlName="confirmPassword">
                                        </div>

                                       
                                        <button type="submit" class="btn btn-primary">Submit</button>
                                    </form>
                                </div> <!-- end col -->


                            </div>
                            <!-- end row-->
                        </div> <!-- end card-body -->
                    </div> <!-- end card -->
                </div><!-- end col -->
            </div><!-- end row -->
        </div>
    </div>
