<div class="content-page">
    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box">
                        <h4 class="page-title">Change Password</h4>
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()">
                                            <div class="mb-3" style="width: 300px;">
                                                <label for="example-oldPassword" class="form-label">Old Password<span
                                                        style="color: red;">*</span></label>
                                                <input type="password" id="example-oldPassword" class="form-control"
                                                    formControlName="oldPassword">
                                            </div>
                                            <div class="mb-3" style="width: 300px;">
                                                <label for="example-newPassword" class="form-label">New Password<span
                                                        style="color: red;">*</span></label>
                                                <input type="password" id="example-newPassword" class="form-control"
                                                    formControlName="newPassword">
                                            </div>
                                            <div class="mb-3" style="width: 300px;">
                                                <label for="example-confirmPassword" class="form-label">Confirm
                                                    Password<span style="color: red;">*</span></label>
                                                <input type="password" id="example-confirmPassword"
                                                    name="example-confirmPassword" class="form-control"
                                                    formControlName="confirmPassword">
                                            </div>
                                            <button type="submit" class="btn btn-primary">Submit</button>
                                        </form>
                                    </div> <!-- end col -->
                                </div>
                                <!-- end row-->
                            </div> <!-- end card-body -->
                        </div> <!-- end card -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
