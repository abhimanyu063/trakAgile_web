<div class="content-page">
  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="page-title-box">
            <div class="page-title-right">
              <form class="d-flex">
                <div class="input-group">
                  <input type="text" class="form-control shadow border-0" id="dash-daterange">
                  <span class="input-group-text bg-primary border-primary text-white">
                    <i class="ri-calendar-todo-fill fs-13"></i>
                  </span>
                </div>
                <a href="javascript: void(0);" class="btn btn-primary ms-2">
                  <i class="ri-refresh-line"></i>
                </a>
              </form>
            </div>
            <h4 class="page-title">Sites</h4>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <p class="text-muted fs-14">
              <div class="table-responsive">
                <table class="table table-hove rtable">
                  <thead>
                    <tr>
                      <th scope="col">S.No</th>
                      <th scope="col">Site Name</th>
                      <th scope="col">Site Village</th>
                      <th scope="col">District</th>
                      <th scope="col">Trip Description</th>
                      <th scope="col">Site Description</th>
                      <th scope="col">Created On</th>
                      <th scope="col">User</th>
                    </tr>
                  </thead>
                  <tbody *ngFor="let site of sites;let indexOfelement=index;">
                    <tr>
                      <td>{{indexOfelement + 1}}</td>
                      <td>{{site.siteName}}</td>
                      <td>{{site.siteVillageName}}</td>
                      <td>{{site.districtName}}</td>
                      <td>{{site.tripTypeDescription}}</td>
                      <td>{{site.siteTypeDescription}}</td>
                      <td>{{site.createdOn|date:'dd-MM-yyyy'}}</td>
                      <td>{{site.userName}}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
