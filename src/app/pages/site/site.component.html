<div class="content-page">
  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="page-title-box">
            <div class="page-title-right">
              <form class="d-flex">
                <div class="input-container c1">
                  <label class="item item-input item-select">
                    <div class="input-label" style="margin-left: 100px;">
                      Status
                      <select (change)="onChangeStatus($event)">
                        <option value="0">All</option>
                        <option value="1">Completed</option>
                        <option value="2">In-Progress</option>
                        <option value="3">Reported Issue</option>
                      </select>
                    </div>
                  </label>
                </div>
                <div class="input-container c2">
                  <div></div>
                  <label class="item item-input item-select">
                    <div class="input-label" style="margin-left: 120px;">
                      Select
                      <select (change)="onChange($event)">
                        <option value="0">All</option>
                        <option value="1">Weekly</option>
                        <option value="2">Monthly</option>
                      </select>
                    </div>
                  </label>
                </div>
                <div class="input-group text-center" style="vertical-align:middle">
                  <span class="label label-info text-center" style="margin-left: 70px;">From</span>
                  <input type="date" class="form-control shadow border-0" id="daterangeFrom"
                    [ngModel]="fromDate | date:'yyyy-MM-dd'" (ngModelChange)="fromDate = $event"
                    [ngModelOptions]="{standalone: true}">
                  <label for="example-username" class="form-label">To</label>
                  <input type="date" class="form-control shadow border-0" id="daterangeTo"
                    [ngModel]="toDate | date:'yyyy-MM-dd'" (ngModelChange)="toDate = $event"
                    [ngModelOptions]="{standalone: true}">
                </div>
                <a href="javascript: void(0);" class="btn btn-primary ms-2" (click)="onRefreshRequests()">
                  <i class="ri-refresh-line"></i>
                </a>
              </form>
            </div>
            <h4 class="page-title">Sites</h4>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12" style="text-align:right; align-items:right">
            <button class="btn btn-success btn-block" (click)="openPDF()" style="margin-right: -22px">Download
              PDF</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <p class="text-muted fs-14">
              <div class="table-responsive" id="requestReport">
                <table class="table table-hove rtable">
                  <thead class="bg-primary" style="color:#fff">
                    <tr>
                      <th scope="col">S.No</th>
                      <th scope="col">Site Name</th>
                      <th scope="col">Village</th>
                      <th scope="col">District</th>
                      <th scope="col">Trip Type</th>
                      <th scope="col">Site Type</th>
                      <th scope="col">Created On</th>
                      <th scope="col">User</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                      *ngFor="let site of sites  | paginate: { itemsPerPage: tableSize, currentPage: page, totalItems: count }; let indexOfelement=index">
                      <td>{{indexOfelement + 1}}</td>
                      <td>{{site.siteName}}</td>
                      <td>{{site.siteVillageName}}</td>
                      <td>{{site.districtName}}</td>
                      <td>{{site.tripTypeDescription}}</td>
                      <td>{{site.siteTypeDescription}}</td>
                      <td>{{site.createdOn|date:'dd-MM-yyyy'}}</td>
                      <td>{{site.userName}}</td>
                    </tr>
                  </tbody>
                </table>
                <div class="pagination">
                  <pagination-controls previousLabel="Prev" nextLabel="Next"
                    (pageChange)="onTableDataChange($event)"></pagination-controls>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
