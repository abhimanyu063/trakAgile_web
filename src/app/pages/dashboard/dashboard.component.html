<div class="content-page">
  <div class="content">
    <!-- Start Content-->
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="page-title-box">
            <div class="page-title-right">
              <form class="d-flex">
                <div class="input-group">
                  <input type="text" class="form-control shadow border-0" id="dash-daterange">
                  <span class="input-group-text bg-primary border-primary text-white">
                    <i class="ri-calendar-todo-fill fs-13"></i>
                  </span>
                </div>
                <a href="javascript: void(0);" class="btn btn-primary ms-2">
                  <i class="ri-refresh-line"></i>
                </a>
              </form>
            </div>
            <h4 class="page-title">Dashboard</h4>
          </div>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-xxl-5 row-cols-lg-3 row-cols-md-2">
        <div class="col">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div class="flex-grow-1 overflow-hidden">
                  <h5 class="text-muted fw-normal mt-0" title="Number of Customers">Pending Requests</h5>
                  <h3 class="my-3">{{pendingRequests}}</h3>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-success me-1">
                      Approved : {{approvedRequests}}</span>
                  </p>
                </div>
                <div class="flex-shrink-0">
                  <div id="widget-customers" class="apex-charts" data-colors="#47ad77,#e3e9ee"></div>
                </div>
              </div>
            </div> <!-- end card-body-->
          </div> <!-- end card-->
        </div> <!-- end col-->

        <div class="col">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div class="flex-grow-1 overflow-hidden">
                  <h5 class="text-muted fw-normal mt-0" title="Number of Orders"> Employee Tracking </h5>
                  <h3 class="my-3">7,543</h3>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-danger me-1"><i class="ri-arrow-down-line"></i> 1.08%</span>
                    <span>Since last month</span>
                  </p>
                </div>
                <div id="widget-orders" class="apex-charts" data-colors="#3e60d5,#e3e9ee"></div>
              </div>
            </div> <!-- end card-body-->
          </div> <!-- end card-->
        </div> <!-- end col-->

        <div class="col">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div class="flex-grow-1 overflow-hidden">
                  <h5 class="text-muted fw-normal mt-0" title="Average Revenue"> Sites Visited </h5>
                  <h3 class="my-3">{{totalRequests}}</h3>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-success me-1">
                      Approved : 2,541</span>
                  </p>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-success me-1">
                      Pending : 2,541</span>
                  </p>
                </div>
                <div id="widget-revenue" class="apex-charts" data-colors="#16a7e9,#e3e9ee"></div>
              </div>

            </div> <!-- end card-body-->
          </div> <!-- end card-->
        </div>
        <div class="col">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div class="flex-grow-1 overflow-hidden">
                  <h5 class="text-muted fw-normal mt-0" title="Average Revenue"> Active User </h5>
                  <h3 class="my-3">{{totalRequests}}</h3>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-danger me-1"><i class="ri-arrow-down-line"></i> 7.00%</span>
                    <span>Since last month</span>
                  </p>
                  <p class="mb-0 text-muted text-truncate">
                    <span class="badge bg-danger me-1">7.00%</span>
                    <span>Since last month</span>
                  </p>
                </div>
                <div id="widget-revenue" class="apex-charts" data-colors="#16a7e9,#e3e9ee"></div>
              </div>

            </div> <!-- end card-body-->
          </div> <!-- end card-->
        </div>
      </div>
      <!-- container -->

    </div>
    <!-- content -->

    <!-- Footer Start -->
    <footer class="footer">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
