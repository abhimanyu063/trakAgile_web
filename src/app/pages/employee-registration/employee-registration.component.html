<div class="content-page">
    <div class="content">

        <!-- Start Content-->
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="header-title">Employee Registration</h4>
                            <br>
                            <div class="row">
                                <div class="col-lg-12">
                                    <form [formGroup]="userForm" (ngSubmit)="onSaveUser()">
                                        <div class="mb-3">
                                            <label for="simpleinput" class="form-label">Name*</label>
                                            <input type="text" id="simpleinput" class="form-control" formControlName="name">
                                        </div>

                                        <div class="mb-3">
                                            <label for="example-email" class="form-label">Email*</label>
                                            <input type="email" id="example-email" name="example-email"
                                                class="form-control" placeholder="Email" formControlName="email">
                                        </div>

                                        <div class="mb-3">
                                            <label for="password" class="form-label">Mobile No.*</label>
                                            <input type="text" id="simpleinput" class="form-control" formControlName="password">
                                        </div>
                                        <div class="mb-3">
                                            <label for="example-password" class="form-label">Temp Password*</label>
                                            <input type="password" id="example-password" class="form-control"
                                                value="password">
                                        </div>
                                        <div class="mb-3">
                                            <label for="example-textarea" class="form-label">Address*</label>
                                            <textarea class="form-control" id="example-textarea" rows="5" formControlName="address"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label for="example-readonly" class="form-label">City*</label>
                                            <input type="text" id="example-readonly" class="form-control" readonly=""
                                                value="" formControlName="city">
                                        </div>


                                        <div class="mb-3">
                                            <label for="example-static" class="form-label">State*</label>
                                            <input type="text" id="example-readonly" class="form-control" readonly=""
                                                value="" formControlName="state">
                                        </div>


                                        <div class="mb-3">
                                            <label for="example-static" class="form-label">Country**</label>
                                            <input type="text" id="example-readonly" class="form-control" readonly=""
                                                value="" formControlName="country">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Submit</button>
                                    </form>
                                </div> <!-- end col -->


                            </div>
                            <!-- end row-->
                        </div> <!-- end card-body -->
                    </div> <!-- end card -->
                </div><!-- end col -->
            </div><!-- end row -->


        </div>
    </div>
