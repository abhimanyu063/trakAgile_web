<div class="content-page" style="margin-top:50px">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <!-- <h4 class="header-title">Employee Registration</h4> -->
                            <br>
                            <div class="row">
                                <div class="col-lg-12">
                                    <form [formGroup]="userForm" (ngSubmit)="onSaveUser()">
                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-username" class="form-label">User Name<span style="color: red;">*</span></label>
                                            <input type="text" id="example-username" class="form-control"
                                                formControlName="userName">
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-name" class="form-label">Name<span style="color: red;">*</span></label>
                                            <input type="text" id="example-name" class="form-control"
                                                formControlName="name">
                                        </div>

                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-email" class="form-label">Email<span style="color: red;">*</span></label>
                                            <input required
                                                type="email" id="example-email" name="example-email"
                                                class="form-control" formControlName="email">
                                        </div>

                                        <div class="mb-3" style="width: 300px;">
                                            <label for="mobile" class="form-label">Mobile No.<span style="color: red;">*</span></label>
                                            <input (keypress)="keyPress($event)" required type="text" id="example-mobile"
                                                class="form-control" formControlName="mobile" maxlength="10" minlength="10">
                                            <!-- <div
                                                *ngIf="mob.mobile.errors.pattern || mob.mobile.errors.maxlength || mob.mobile.errors.minlength">
                                                Mobile number should be 10 digit.
                                            </div> -->
                                        </div>

                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-password" class="form-label">Password<span style="color: red;">*</span></label>
                                            <input type="password" id="example-password" class="form-control"
                                                formControlName="password" value="">
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label class="form-label">
                                                Role<span style="color: red;">*</span>
                                                <div>
                                                    <select formControlName="roleId" class="form-select">
                                                        <option value="0">Select</option>
                                                        <option value="2">User</option>
                                                        <option value="1">Admin</option>
                                                        <option value="3">Supervisor</option>
                                                    </select>
                                                </div>

                                            </label>
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label class="form-label">
                                                Supervisor<span style="color: red;">*</span>
                                                <div>
                                                    <select formControlName="supervisorId" class="form-select">
                                                        <option value="0">Select</option>
                                                        <option *ngFor="let supervisor of supervisors"
                                                            [value]="supervisor.userId">{{supervisor.name}}
                                                        </option>
                                                    </select>
                                                </div>

                                            </label>
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-textarea" class="form-label">Address<span style="color: red;">*</span></label>
                                            <textarea class="form-control" id="example-textarea" rows="2"
                                                formControlName="address"></textarea>
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-City" class="form-label">City<span style="color: red;">*</span></label>
                                            <input type="text" id="example-City" name="example-City"
                                                class="form-control" placeholder="" formControlName="city">
                                        </div>
                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-State" class="form-label">State<span style="color: red;">*</span></label>
                                            <input type="text" id="example-State" name="example-State"
                                                class="form-control" placeholder="" formControlName="state">
                                        </div>

                                        <div class="mb-3" style="width: 300px;">
                                            <label for="example-Country" class="form-label">Country<span style="color: red;">*</span></label>
                                            <input type="text" id="example-Country" name="example-Country"
                                                class="form-control" placeholder="" formControlName="country">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Submit</button>
                                    </form>
                                </div> <!-- end col -->


                            </div>
                            <!-- end row-->
                        </div> <!-- end card-body -->
                    </div> <!-- end card -->
                </div><!-- end col -->
            </div><!-- end row -->
        </div>
    </div>
