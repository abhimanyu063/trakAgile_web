<div class="content-page">
    <div class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-12">
            <div class="page-title-box">
              <div class="page-title-right">
                <form class="d-flex">
                  <!-- <div class="input-group text-center" style="vertical-align:middle">
                    <span class="label label-info text-center">From</span>
                  </div> -->
                  <!-- <a href="javascript: void(0);" class="btn btn-primary ms-2" (click)="onRefreshRequests()">
                    <i class="ri-refresh-line"></i>
                  </a> -->
                </form>
              </div>
              <h4 class="page-title">Online User</h4>
            </div>
          </div>
        </div>
        <!-- <div class="row">
          <div class="col-lg-12" style="text-align:right; align-items:right">
            <button class="btn btn-success btn-block" (click)="openPDF()">Download PDF</button>
        </div>
        </div> -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-body">
                <p class="text-muted fs-14">
                <div class="table-responsive" id="requestReport">
                  <table class="table table-hove rtable">
                    <thead>
                      <tr>
                        <th scope="col">S.No</th>
                        <th scope="col">Name</th>
                        <th scope="col">Site Name </th>
                        <th scope="col">Village Name</th>
                        <th scope="col">Site Description</th>
                        <th scope="col">District Name</th>
                        <th scope="col">Total Site</th>
                        <!-- <th scope="col">Site Added Time</th> -->
                      </tr>
                    </thead>
                    <tbody *ngFor="let request of requests;let indexOfelement=index;">
                      <tr>
                        <td scope="row">{{indexOfelement + 1}}</td>
                        <td>{{request.name}}</td>
                        <td>{{request.siteName}}</td>
                        <td>{{request.siteVillageName}}</td>
                        <td>{{request.siteTypeDescription}}</td>
                        <td>{{request.districtName}}</td>
                        <td>{{request.count}}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
