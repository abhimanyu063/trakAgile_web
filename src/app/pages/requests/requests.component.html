<div class="content" style="margin-left:50px; margin-right:50px">
    <table class="table table-striped">
        <thead>
          <tr>
            <th>ID #</th>
            <th>Request Type</th>
            <th>Date</th>
            <th>Comment</th>
          </tr>
        </thead>
        <tbody *ngFor="let request of requests">
          <tr>
            <td>{{request.requestId}}</td>
            <td>{{request.requestTypeDescription}}</td>
            <td>{{request.requestDate}}</td>
            <td>{{request.requestComment}}</td>
          </tr>
        </tbody>
      </table>
</div>
