<div class="content-page">
  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="page-title-box">
            <h4 class="page-title">Site Issue Reported</h4>
          </div>
          <div class="card">
            <div class="card-body">
              <p class="text-muted fs-14">
              <div class="table-responsive" id="requestReport">
                <table class="table table-hove rtable">
                  <thead>
                    <tr>
                      <th scope="col">S.No</th>
                      <th scope="col">Name </th>
                      <th scope="col">Site Name</th>
                      <th scope="col">Site Village Name</th>
                      <th scope="col">Created On</th>
                      <th scope="col">Comments</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                      *ngFor="let request of requests  | paginate: { itemsPerPage: tableSize, currentPage: page, totalItems: count }; let indexOfelement =index">
                      <td scope="row">{{(page - 1) * 10 + indexOfelement +1}}</td>
                      <td>{{request.name}}</td>
                      <td>{{request.siteName}}</td>
                      <td>{{request.siteVillageName}}</td>
                      <td>{{request.createdOn|date:'dd-MM-yyyy'}}</td>
                      <td>{{request.comment}}</td>
                    </tr>
                  </tbody>
                </table>
                <div class="pagination">
                  <pagination-controls previousLabel="Prev" nextLabel="Next"
                    (pageChange)="onTableDataChange($event)"></pagination-controls>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
